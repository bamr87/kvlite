name: CI

# Adopted from bamr87/bamr87 via standardize-fanout.yml. This is a thin caller —
# the gate logic is shared and versioned in
# bamr87/bamr87/.github/workflows/standard-ci.yml. Don't edit the logic here.
# (main is substituted with the repo's default branch on adoption.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: bamr87/bamr87/.github/workflows/standard-ci.yml@v2
    secrets: inherit

  # Stack-specific gates: format, lint (any warning fails) and test.
  # standard-ci@v2 auto-detects node/python/ruby only.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1   # tag ref (UPS-QA-40); @v1 needs the toolchain input
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format (rustfmt)
        run: cargo fmt --check
      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
