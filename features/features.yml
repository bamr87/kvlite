  - id: KVL-009
    title: "Model-based differential tests and WAL crash/fault-injection harness"
    description: "proptest generates random put/get/del (later flush/compact/reopen) sequences and checks every read against a BTreeMap model; WAL recovery is tested by truncating the last record at every byte offset and flipping bytes, asserting exactly the acknowledged prefix survives. Runs under cargo test with a bounded case count. Issue #20."
    implemented: false
    status: planned
    prd: [FR7]
    surface: lib
    docs: PRD.md
    tags: [phase-1, deep-dive]
    date: 2026-11-27
